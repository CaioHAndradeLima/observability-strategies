[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observability-strategies"
version = "0.1.0"
description = "Reference implementation and evaluation gates for observability and offline eval in RAG/multi-agent systems"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = []
llm-judge = ["openai>=1.100"]

[project.scripts]
observability-lab = "observability_strategies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
